services:
  - type: web
    name: wispr-voice-email-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wispr-voice-email-db
          property: connectionString
      - key: AWS_REGION
        sync: false
      - key: BEDROCK_MODEL_ID
        value: amazon.nova-pro-v1:0
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false

databases:
  - name: wispr-voice-email-db
    plan: free
    databaseName: wispr_voice_email
    user: wispr_voice_email
