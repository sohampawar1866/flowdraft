name: Build and release Chrome extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Verify tag matches extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./apps/extension/package.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $RELEASE_TAG does not match extension version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies and build Load unpacked ZIP
        run: |
          npm ci --include=dev
          npm run zip
        env:
          WXT_API_BASE_URL: https://wispr-voice-email-api.onrender.com

      - name: Verify packaged extension version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./apps/extension/package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./apps/extension/.output/chrome-mv3/manifest.json').version")"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$MANIFEST_VERSION" ] || [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG, package version $PACKAGE_VERSION, and manifest version $MANIFEST_VERSION must match" >&2
            exit 1
          fi

      - name: Prepare stable download filename
        run: |
          mkdir -p release
          cp apps/extension/.output/*.zip release/flowdraft-chrome.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/flowdraft-chrome.zip --title "FlowDraft Stable $GITHUB_REF_NAME" --generate-notes --latest
